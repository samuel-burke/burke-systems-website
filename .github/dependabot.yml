# Weekly dependency updates, opened against dev like any other task branch.
# The cooldown matches minimumReleaseAge in pnpm-workspace.yaml, which rejects
# releases younger than three days.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
